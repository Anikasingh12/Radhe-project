<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="340" viewBox="0 0 1020 340">
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff4ff"/>
      <stop offset="1" stop-color="#2bb6d1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
  </defs>
  <!-- diamond icon -->
  <g transform="translate(20 70)">
    <polygon points="40,0 160,0 200,60 100,200 0,60" fill="url(#gem)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <polyline points="0,60 200,60" fill="none" stroke="#fff" stroke-width="5"/>
    <polyline points="40,0 70,60 100,200 130,60 160,0" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="70,60 100,0 130,60" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="240" y="215" textLength="590" lengthAdjust="spacingAndGlyphs" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="150" fill="#ffffff" letter-spacing="2">DIAMOND</text>
  <text x="875" y="230" textLength="130" lengthAdjust="spacingAndGlyphs" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="190" fill="url(#gold)" stroke="#8a5a00" stroke-width="3">X</text>
</svg>
